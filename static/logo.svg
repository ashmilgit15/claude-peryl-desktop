<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="peryl-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f08a5d" />
      <stop offset="50%" stop-color="#da7756" />
      <stop offset="100%" stop-color="#b85b3a" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#17171a" />
  <g transform="translate(50, 50)" filter="url(#glow)">
    <!-- Central 8-point Starburst -->
    <path d="M 0 -36 L 6 -12 L 30 -30 L 12 -6 L 36 0 L 12 6 L 30 30 L 6 12 L 0 36 L -6 12 L -30 30 L -12 6 L -36 0 L -12 -6 L -30 -30 L -6 -12 Z" fill="url(#peryl-grad)" />
    <!-- Inner Geometric Accent -->
    <polygon points="0,-16 11,-11 16,0 11,11 0,16 -11,11 -16,0 -11,-11" fill="#17171a" />
    <circle cx="0" cy="0" r="6" fill="url(#peryl-grad)" />
  </g>
</svg>
