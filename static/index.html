<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude Peryl Desktop</title>
    <!-- CSS Dependencies -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="dark-theme">
    <div id="app-container">
        <!-- Sidebar Navigation -->
        <aside id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <i class="fa-solid fa-sparkles brand-icon"></i>
                    <span class="brand-name">Claude Peryl</span>
                    <span class="badge">v5.0</span>
                </div>
                <button id="btn-new-chat" class="btn-primary">
                    <i class="fa-solid fa-plus"></i> New Chat
                </button>
            </div>

            <div class="sidebar-mode-selector">
                <label>Mode</label>
                <div class="mode-toggle-group">
                    <button class="mode-btn active" data-mode="standard">
                        <i class="fa-solid fa-message"></i> Standard
                    </button>
                    <button class="mode-btn" data-mode="deep-research">
                        <i class="fa-solid fa-brain"></i> Deep Dive
                    </button>
                </div>
            </div>

            <div class="sidebar-model-selector">
                <label for="model-select">Model</label>
                <select id="model-select" class="dropdown">
                    <option value="claude-peryl">Claude Peryl 5 (Default)</option>
                    <option value="claude-peryl-opus">Claude Peryl Opus 4.8</option>
                    <option value="claude-peryl-sonnet">Claude Peryl Sonnet 4.6</option>
                    <option value="claude-peryl-deep-research">Claude Peryl Deep Research Agent</option>
                </select>
            </div>

            <div class="chat-history-container">
                <div class="section-title">Recent Chats</div>
                <ul id="chat-threads-list" class="threads-list">
                    <!-- Dynamic Thread items -->
                </ul>
            </div>

            <div class="sidebar-footer">
                <button id="btn-settings" class="btn-icon-text">
                    <i class="fa-solid fa-gear"></i> Settings
                </button>
                <div class="user-credits">Created by ashmil P</div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main id="chat-section">
            <header class="chat-header">
                <div class="header-info">
                    <h2 id="current-thread-title">New Conversation</h2>
                    <span id="active-mode-badge" class="badge-mode">Standard Chat</span>
                </div>
                <div class="header-actions">
                    <button id="btn-toggle-artifacts" class="btn-secondary" style="display: none;">
                        <i class="fa-solid fa-code"></i> Artifacts (<span id="artifact-count">0</span>)
                    </button>
                </div>
            </header>

            <div id="messages-container" class="messages-scroll">
                <!-- Welcome Screen -->
                <div id="welcome-screen" class="welcome-box">
                    <div class="welcome-icon"><i class="fa-solid fa-bolt"></i></div>
                    <h1>What can Claude Peryl help you with today?</h1>
                    <p>Powered by ashmil P's Claude Peryl 5 with Deep Research Subagents and Interactive Artifacts.</p>
                    <div class="prompt-suggestions">
                        <button class="suggestion-card" data-prompt="Conduct a deep dive research report on recent quantum computing breakthroughs in 2026.">
                            <i class="fa-solid fa-atom"></i> Deep Research: Quantum Breakthroughs
                        </button>
                        <button class="suggestion-card" data-prompt="Create an interactive HTML/JS dashboard artifact to visualize personal finance budget.">
                            <i class="fa-solid fa-chart-pie"></i> Interactive Dashboard Artifact
                        </button>
                        <button class="suggestion-card" data-prompt="Run a Python code subagent to analyze prime numbers and benchmark execution time.">
                            <i class="fa-solid fa-terminal"></i> Code Subagent Runner
                        </button>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div id="input-area">
                <div id="subagent-status-bar" class="subagent-bar" style="display: none;">
                    <div class="spinner"></div>
                    <span id="subagent-status-text">Subagents researching topic...</span>
                </div>
                <div class="input-wrapper">
                    <textarea id="prompt-input" placeholder="Message Claude Peryl... (Shift+Enter for new line)" rows="1"></textarea>
                    <div class="input-toolbar">
                        <div class="toolbar-left">
                            <button id="btn-toggle-deep-research" class="chip-btn" title="Toggle Deep Research Subagent Mode">
                                <i class="fa-solid fa-network-wired"></i> Deep Research Subagents
                            </button>
                        </div>
                        <button id="btn-send" class="btn-send">
                            <i class="fa-solid fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Artifacts Split-View Panel -->
        <aside id="artifacts-panel" class="artifacts-sidebar collapsed">
            <div class="artifacts-header">
                <div class="artifact-title-box">
                    <i class="fa-solid fa-cubes"></i>
                    <span id="artifact-active-title">Artifact Preview</span>
                </div>
                <div class="artifacts-controls">
                    <button id="btn-artifact-tab-preview" class="tab-btn active">Preview</button>
                    <button id="btn-artifact-tab-code" class="tab-btn">Code</button>
                    <button id="btn-copy-artifact" class="btn-icon" title="Copy Content"><i class="fa-regular fa-copy"></i></button>
                    <button id="btn-close-artifacts" class="btn-icon" title="Close Panel"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>
            <div class="artifacts-body">
                <div id="artifact-preview-container" class="artifact-view-tab active">
                    <iframe id="artifact-iframe" sandbox="allow-scripts allow-modals"></iframe>
                </div>
                <div id="artifact-code-container" class="artifact-view-tab">
                    <pre><code id="artifact-code-block" class="language-html"></code></pre>
                </div>
            </div>
        </aside>
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Claude Peryl Settings</h3>
                <button id="btn-close-modal" class="btn-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Active System Prompt (ashmil P model prompt)</label>
                    <textarea id="sys-prompt-editor" rows="8"></textarea>
                </div>
                <div class="form-group">
                    <label>Subagent Max Depth</label>
                    <input type="number" id="subagent-depth-input" value="3" min="1" max="5">
                </div>
            </div>
            <div class="modal-footer">
                <button id="btn-save-settings" class="btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- JS Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
